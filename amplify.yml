version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd vendorpreview
        - npm ci
    build:
      commands:
        - cd vendorpreview
        - NEXT_DISABLE_TURBOPACK=1 npx next build

  artifacts:
    baseDirectory: vendorpreview/.next/standalone
    files:
      - '**/*'

  cache:
    paths:
      - vendorpreview/node_modules/**/*
