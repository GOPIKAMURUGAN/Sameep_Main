version: 1
applications:

  # -----------------------------
  # React Admin Console
  # -----------------------------
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  # Harish / Niks Preview (NextJS)
  - appRoot: nikspreview-site/salon
    frontend:
    phases:
      preBuild:
        commands:
          - npm ci
      build:
        commands:
          - npm run build
    artifacts:
      baseDirectory: .next/standalone
      files:
        - '**/*'
    cache:
      paths:
        - node_modules/**/*
