version: 1
applications:

  # -----------------------------
  # React Admin Console
  # -----------------------------
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

  # -----------------------------
  # Vendor Preview (Next.js App Router)
  # -----------------------------
  - appRoot: vendorpreview
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - NEXT_DISABLE_TURBOPACK=1 npx next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

   # -----------------------------
  # Ynot Web (Marketplace - Next.js)
  # -----------------------------
  - appRoot: ynot/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - NEXT_DISABLE_TURBOPACK=1 npx next build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
